[workspace]
resolver = "2"
members = ["crates/ooxp", "crates/ooxp-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
zip = "2"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
