[workspace]
resolver = "2"
members = ["crates/ooxp", "crates/ooxp-cli"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
zip = { version = "2", default-features = false }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
