<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ooxp 示例</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <header>
    <h1>ooxp</h1>
    <p>下面是创建和修改的示例请求。运行后直接下载，页面不预览。选了目录的话，文件同时写入该目录。</p>
    <div class="row">
      <button id="pick" type="button">选择目录</button>
      <button id="restore" type="button" hidden>恢复授权</button>
      <span id="dir-name">还没有授权目录。不选也能运行，结果只下载。</span>
    </div>
  </header>
  <main id="examples"></main>
  <section>
    <h2>结果</h2>
    <div id="log"></div>
  </section>
  <script type="module" src="./app.js"></script>
</body>
</html>
