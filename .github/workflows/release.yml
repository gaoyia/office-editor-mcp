name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            lint: true
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            lint: false
          - runner: macos-latest
            platform: darwin
            arch: arm64
            lint: false
          - runner: windows-latest
            platform: win32
            arch: x64
            lint: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        if: matrix.lint
        run: cargo fmt --all -- --check

      - name: clippy
        if: matrix.lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build
        run: cargo build -p ooxp-cli --release

      - name: pack
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          platform="${{ matrix.platform }}"
          arch="${{ matrix.arch }}"
          stem="ooxp-v${version}-${platform}-${arch}"
          mkdir -p "dist/${stem}"
          if [ "$platform" = "win32" ]; then
            cp target/release/ooxp.exe "dist/${stem}/ooxp.exe"
            python -c 'import sys, zipfile; z = zipfile.ZipFile(sys.argv[1], "w", zipfile.ZIP_DEFLATED); z.write(sys.argv[2], sys.argv[3]); z.close()' \
              "dist/${stem}.zip" "dist/${stem}/ooxp.exe" "${stem}/ooxp.exe"
          else
            cp target/release/ooxp "dist/${stem}/ooxp"
            chmod +x "dist/${stem}/ooxp"
            tar -C dist -czf "dist/${stem}.tar.gz" "$stem"
          fi
          rm -rf "dist/${stem}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: wasm-bindgen
        run: |
          set -euo pipefail
          curl -sSfL -o wbg.tgz https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz
          tar -xzf wbg.tgz
          sudo mv wasm-bindgen-0.2.127-x86_64-unknown-linux-musl/wasm-bindgen /usr/local/bin/wasm-bindgen

      - name: build
        run: cargo build -p ooxp-wasm --target wasm32-unknown-unknown --release

      - name: pack
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          stem="ooxp-v${version}-wasm"
          out="dist/${stem}"
          mkdir -p "$out"
          wasm-bindgen target/wasm32-unknown-unknown/release/ooxp_wasm.wasm --out-dir "$out" --target bundler
          cp LICENSE "$out/LICENSE"
          python - "$out" "$version" <<'PY'
          import json, pathlib, sys
          out, version = sys.argv[1], sys.argv[2]
          root = pathlib.Path(out)
          package = {
              "name": "wasm",
              "version": version,
              "description": "ooxp 的 TypeScript 绑定。先调用 init，再使用 Session。",
              "type": "module",
              "main": "./index.ts",
              "types": "./index.ts",
              "files": ["index.ts", "ooxp_wasm.js", "ooxp_wasm.d.ts", "ooxp_wasm_bg.wasm", "LICENSE"],
          }
          root.joinpath("package.json").write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          root.joinpath("index.ts").write_text(
              "// 浏览器里调用 ooxp。先 await init()，再 new Session()。\n"
              "export { default as init, Session } from \"./ooxp_wasm.js\";\n",
              encoding="utf-8",
          )
          PY
          tar -C dist -czf "dist/${stem}.tar.gz" "$stem"
          rm -rf "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    needs: [package, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v${version}" ]; then
            echo "tag ${tag} 与 Cargo.toml 的版本 v${version} 不一致" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum ooxp-v"${version}"-* | sort -k2 > SHASUMS256.txt
          )
          notes=$(mktemp)
          printf '%s\n' "来自 tag ${tag} 的 ${GITHUB_SHA}。" "" "命令行包名是 Node.js 的 process.platform 加 process.arch。另有 TypeScript 包 ooxp-v${version}-wasm.tar.gz。" > "$notes"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ooxp ${tag}" \
            --notes-file "$notes"
