[package]
name = "ooxp"
version = { workspace = true }
edition = { workspace = true }
license-file = "../../LICENSE"
description = "Office Open XML Patch：用领域 JSON 读写 .xlsx / .docx / .pptx"

[dependencies]
zip = { workspace = true, default-features = false, features = ["deflate", "deflate64", "aes-crypto", "time"] }
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }
zip = { workspace = true, features = ["bzip2", "lzma", "zstd"] }

[dev-dependencies]
# 集成测试要自己拆包核对字节，用得到 zip。
zip = { workspace = true, features = ["deflate"] }
